spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dems_db}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 50

app:
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    bucket: ${STORAGE_BUCKET:dems-evidence-storage}
    region: ${STORAGE_REGION:auto}
    endpoint: ${STORAGE_ENDPOINT:}
    base-path: ${STORAGE_BASE_PATH:uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://your-frontend-domain.vercel.app}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.dems: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR
