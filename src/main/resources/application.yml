spring:
  application:
    name: digital-evidence-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# Springdoc OpenAPI Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

# Application Specific Properties
app:
  jwt:
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours (86,400,000 ms)
  storage:
    location: ${STORAGE_LOCATION:uploads}
    cases-dir: cases
    temp-dir: temp
    qr-dir: qr

